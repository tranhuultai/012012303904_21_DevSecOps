name: Python CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Code/DevSecOps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Code/DevSecOps/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest -v

  security-scan:
    name: Security scans (collection mode)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      # SAST: Semgrep
      - name: Set up Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output reports/semgrep.json \
            Code/DevSecOps
        continue-on-error: true

      # Secret scanning: Gitleaks
      - name: Set up Go for Gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@latest

      - name: Run Gitleaks secret scan
        env:
          PATH: ${{ env.PATH }}:/home/runner/go/bin
        run: |
          gitleaks git \
            --report-format json \
            --report-path reports/gitleaks.json \
            --exit-code 0
        continue-on-error: true

      # SCA: Trivy filesystem/dependency scan
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@0.33.0
        with:
          scan-type: fs
          scan-ref: Code/DevSecOps
          scanners: vuln
          format: json
          output: reports/trivy.json
          exit-code: "0"
          ignore-unfixed: true

      # Always publish reports, even when a scan step fails
      - name: Upload security scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14